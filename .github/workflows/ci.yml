name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    name: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: docker/setup-buildx-action@v3
      - run: python -m pip install --require-hashes -r requirements/py311-dev-agent.txt
      - run: python -m pip install --no-deps -e .
      - run: npm ci
      - run: python -m playwright install --with-deps chromium
      - run: make pre-push
      - name: Store validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            coverage.xml
            coverage.json
            reports/build.json
            reports/evals/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
