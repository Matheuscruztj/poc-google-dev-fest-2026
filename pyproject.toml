[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventops-ai"
version = "0.1.0"
description = "Demonstração offline de agenda, FAQ e reservas fictícias para eventos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.133,<1", "fastmcp==2.14.5", "psycopg[binary]==3.3.6", "starlette>=1.3.1,<2", "uvicorn[standard]>=0.34,<1"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "httpx>=0.27,<1", "httpx2>=2.0,<3", "mypy>=1.11,<2", "playwright==1.63.0", "pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]
agent = ["google-adk==2.11.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*", "mcp_server*"]

[tool.setuptools.package-data]
app = ["static/*", "data/*.json", "data/faq/*.md", "migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: requires the Playwright Chromium browser"]
addopts = "-ra --strict-markers"

